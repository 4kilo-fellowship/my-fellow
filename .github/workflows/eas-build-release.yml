name: EAS Build and Create Release (wait + attach link)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check Expo Identity
        run: eas whoami

      - name: Run EAS build and wait (JSON)
        id: eas_build
        run: |
          set -o pipefail
          eas build --platform android --profile production --non-interactive --wait --json > build-output.json

          if ! jq empty build-output.json 2>/dev/null; then
            echo "Error: build-output.json is not valid JSON"
            cat build-output.json
            exit 1
          fi

          BUILD_ID=$(jq -r '.id // .buildId // .data.id // .[0].id // empty' build-output.json | head -n1)

          if [ -z "$BUILD_ID" ]; then
            echo "Error: Could not find Build ID in EAS output"
            cat build-output.json
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Get artifact URL
        id: get_url
        run: |
          eas build:view ${{ steps.eas_build.outputs.build_id }} --json > build-details.json
          ARTIFACT_URL=$(jq -r '.artifacts?.url // .artifacts?.buildUrl // .artifacts?.apk?.url // .artifacts?.aab?.url // .artifacts?.ipa?.url // empty' build-details.json)

          if [ -z "$ARTIFACT_URL" ]; then
            echo "Error: Could not find artifact URL"
            cat build-details.json
            exit 1
          fi

          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ steps.eas_build.outputs.build_id }}"
          name: "EAS build ${{ steps.eas_build.outputs.build_id }}"
          body: |
            EAS build finished.

            **Build ID:** `${{ steps.eas_build.outputs.build_id }}`
            **Download Link:** [Download APK](${{ steps.get_url.outputs.artifact_url }})

            _This release was automatically generated by GitHub Actions._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
